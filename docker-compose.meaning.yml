# 8101 검수 기동. 본 서비스(docker-compose.yml, 8100)와 컨테이너 이름이 같으므로
# 동시에 올리지 않는다.
#
# 기동: docker compose -f docker-compose.meaning.yml up -d --build
# OpenAPI: http://127.0.0.1:8101/docs
# 헬스: curl http://127.0.0.1:8101/health

services:
  robo-meta-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: robo-meta-api:dev
    container_name: robo-meta-api
    restart: unless-stopped
    ports:
      - "8101:8100"
    env_file:
      - .env
    environment:
      ROBO_RUNTIME_SETTINGS_FILE: "${ROBO_RUNTIME_SETTINGS_FILE:-/app/config/runtime-settings.docker.local.yaml}"
      METADATA_PG_PASSWORD: "${METADATA_PG_PASSWORD:?METADATA_PG_PASSWORD is required}"
      API_HOST: "0.0.0.0"
      API_PORT: "8100"
      TZ: "Asia/Seoul"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - default
      - kair-control-plane
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  kair-control-plane:
    external: true
    name: kair-metadata-platform_control-plane
