# Commit-safe template. Copy to a local runtime-settings file.
# Source identity is NOT configured here — Metadata Store t2s_datasources is SoT.
robo_meta_api:
  api_host: "0.0.0.0"
  api_port: 8100
  metadata_backend: postgres

  metadata_store:
    host: host.docker.internal
    port: 5433
    database: t2s
    schema: public
    user: postgres
    password_ref:
      provider: process_env
      env_key: METADATA_PG_PASSWORD

  embedding:
    provider: http
    base_url: https://api.openai.com/v1
    model: text-embedding-3-small
    dimensions: 1024
    auth_mode: bearer
    api_key_ref:
      provider: process_env
      env_key: OPENAI_API_KEY
    timeout_seconds: 30

  decision:
    table_top_k: 10
    column_top_m: 10
    minimum_similarity: 0.2
    verified_join_confidence: 1.0
    convention_join_confidence: 0.7
    hyde_enabled: true
    hyde_model: gpt-4o-mini
    hyde_weight: 0.6
    question_weight: 0.4
    role_weight: 0.35
    role_top_k: 3
    role_min_score_ratio: 0.8
    role_semantic_floor: 0.55
    score_gap_ratio: 0.85
    score_min_step: 0.012
    score_top_radius: 0.01
    fk_max_hops: 3
    fk_path_limit: 50

  execution:
    backend: mindsdb
    sql_api_url: http://host.docker.internal:47334/api/sql/query
    default_timeout_seconds: 10
    maximum_timeout_seconds: 30
    default_max_rows: 1000
    maximum_rows: 10000
    maximum_response_bytes: 10485760
    audit_log_path: /app/logs/query_audit.jsonl
