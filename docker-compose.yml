# robo-meta-api — gen-2 (Neo4j 베이스 v0.6 RC body 정합 meta-api)
#
# 외부 의존 컨테이너 (별도 기동):
#   - robo-neo4j      (bolt 7687, neo4j:2025.11.2-community)
#   - robo-postgres   (PG 5432, rwis DB / RWIS 스키마)
#
# 본 compose 는 robo-meta-api 단독 기동만 정의한다 (PRD §2 의존성 분리 원칙).

version: "3.9"

services:
  robo-meta-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: robo-meta-api:dev
    container_name: robo-meta-api
    restart: unless-stopped
    ports:
      - "8097:8097"
    env_file:
      - .env
    environment:
      # host.docker.internal 폴백 — 호스트의 robo-neo4j / robo-postgres 와 연결
      NEO4J_URI: "${NEO4J_URI:-bolt://host.docker.internal:7687}"
      SOURCE_PG_HOST: "${SOURCE_PG_HOST:-host.docker.internal}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
