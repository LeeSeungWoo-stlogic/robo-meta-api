# robo-meta-api — K-AIR-metadata-platform store + MindsDB (control-plane network)
#
# 기동: docker compose up -d --build
# OpenAPI: http://127.0.0.1:8100/docs
# 헬스: curl http://127.0.0.1:8100/health

services:
  robo-meta-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: robo-meta-api:dev
    container_name: robo-meta-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      - .env
    environment:
      ROBO_RUNTIME_SETTINGS_FILE: "${ROBO_RUNTIME_SETTINGS_FILE:-/app/config/runtime-settings.docker.local.yaml}"
      METADATA_PG_PASSWORD: "${METADATA_PG_PASSWORD:?METADATA_PG_PASSWORD is required}"
      V2_PG_DSN: "${V2_PG_DSN:-}"
      V2_PG_SCHEMA: "public"
      V2_TENANT_ID: "kwater"
      V2_EMBEDDING_PROVIDER: "fixture"
      V2_EMBEDDING_DIMENSIONS: "16"
      API_HOST: "0.0.0.0"
      API_PORT: "8100"
      TZ: "Asia/Seoul"
      SOURCE_PG_HOST: "${SOURCE_PG_HOST:-host.docker.internal}"
      SOURCE_PG_PORT: "${SOURCE_PG_PORT:-5432}"
      SOURCE_PG_DB: "${SOURCE_PG_DB:-rwis}"
      SOURCE_PG_USER: "${SOURCE_PG_USER:-postgres}"
      SOURCE_PG_PASS: "${SOURCE_PG_PASS:-}"
      SOURCE_PG_SCHEMA: "${SOURCE_PG_SCHEMA:-RWIS}"
      PG_HOST: "${SOURCE_PG_HOST:-host.docker.internal}"
      PG_PORT: "${SOURCE_PG_PORT:-5432}"
      PG_DATABASE: "${SOURCE_PG_DB:-rwis}"
      PG_USER: "${SOURCE_PG_USER:-postgres}"
      PG_PASSWORD: "${SOURCE_PG_PASS:-}"
      PG_SCHEMAS: "${SOURCE_PG_SCHEMA:-RWIS}"
      ENTITY_RESOLUTION_ENABLED: "1"
      ENTITY_PROBE_DATASOURCE: "rwis"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - default
      - kair-control-plane
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  kair-control-plane:
    external: true
    name: kair-metadata-platform_control-plane
